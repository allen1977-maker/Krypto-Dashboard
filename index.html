<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Krypto-Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --akzent: #8c7cf0;
    --akzent-glanz: rgba(140, 124, 240, 0.35);
  }
  * {
    box-sizing: border-box;
  }
  html {
    overflow-x: hidden;
  }
  body {
    font-family: "Inter", Arial, sans-serif;
    background: linear-gradient(160deg, #1b1b2f 0%, #23233f 45%, #1b1b2f 100%);
    color: #eee;
    padding: 20px;
  }
  h1 {
    text-align: center;
    font-size: 26px;
    color: var(--akzent);
    text-shadow: 0 0 20px var(--akzent-glanz);
  }
  #status {
    text-align: center;
    color: #999;
    overflow-wrap: break-word;
    padding: 0 10px;
  }
  #status.fehler {
    color: #ffb74d;
  }
  .steuerung {
    max-width: 600px;
    margin: 14px auto 0;
    text-align: center;
    font-size: 14px;
    padding: 0 10px;
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 6px;
  }
  .steuerung select {
    background: #2a2a3d;
    color: #eee;
    border: 1px solid #444;
    border-radius: 4px;
    padding: 4px 8px;
    font-size: 13px;
    width: 180px;
    max-width: 100%;
    font-family: inherit;
  }
  .steuerung select:focus {
    outline: none;
    border-color: var(--akzent);
    box-shadow: 0 0 0 2px var(--akzent-glanz);
  }

  /* --- Karten statt Tabelle --- */
  .karten-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 16px;
    max-width: 900px;
    margin: 24px auto;
    padding: 0 10px;
  }
  .coin-karte {
    background: linear-gradient(145deg, #2b2b45, #22223a);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
    opacity: 0;
    animation: einblenden 0.5s ease forwards;
  }
  @keyframes einblenden {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .karte-kopf {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
  }
  .karte-name {
    font-weight: 600;
    font-size: 15px;
  }
  .logo {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .karte-preis {
    font-size: 22px;
    font-weight: 700;
    margin: 4px 0 8px;
    padding: 2px 6px;
    border-radius: 6px;
    display: inline-block;
    transition: background-color 0.6s ease;
  }
  .karte-preis.blitz {
    background-color: var(--akzent-glanz);
  }
  .karte-aenderung {
    font-size: 14px;
    font-weight: 600;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 3px 10px;
    border-radius: 20px;
  }
  .karte-sparkline {
    margin-top: 12px;
    display: flex;
    justify-content: center;
  }

  .gruen { color: #4caf50; }
  .rot { color: #f44336; }
  .karte-aenderung.gruen { background: rgba(76, 175, 80, 0.14); }
  .karte-aenderung.rot { background: rgba(244, 67, 54, 0.14); }

  .chart-titel {
    text-align: center;
    margin-top: 10px;
    color: #ccc;
    font-size: 16px;
  }
  .chart {
    max-width: 600px;
    margin: 15px auto 10px;
  }
  .linien-chart {
    width: 100%;
    height: 220px;
    display: block;
  }
  .linie {
    opacity: 0;
    animation: linieEinblenden 0.8s ease forwards;
  }
  @keyframes linieEinblenden {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  .chart-achsen {
    display: flex;
    justify-content: space-between;
    max-width: 600px;
    margin: 4px auto 30px;
    padding: 0 4px;
    font-size: 12px;
    color: #888;
  }
  .legende {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px 20px;
    margin-top: 10px;
    padding: 0 10px;
    font-size: 13px;
    color: #ccc;
  }
  .legende-eintrag {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .legende-farbe {
    width: 12px;
    height: 12px;
    border-radius: 3px;
  }
  /* Mobile-Anpassungen für kleine Bildschirme */
  @media (max-width: 480px) {
    body { padding: 10px; }
    h1 { font-size: 20px; }
    #status { font-size: 12px; }
    .steuerung { font-size: 12px; }
    .karten-grid { grid-template-columns: 1fr; gap: 12px; }
    .coin-karte { padding: 12px; }
    .karte-preis { font-size: 19px; }
    .logo { width: 24px; height: 24px; }
    .linien-chart { height: 180px; }
    .legende { gap: 10px 14px; font-size: 11px; }
  }
</style>
</head>
<body>

<h1>Krypto-Dashboard - (Iva is GREAT 😊)</h1>
<p id="status">Lade Daten...</p>

<div class="steuerung">
  <label for="sortierung">Sortieren nach:</label>
  <select id="sortierung">
    <option value="standard">Standard</option>
    <option value="preis-auf">Preis (niedrig → hoch)</option>
    <option value="preis-ab">Preis (hoch → niedrig)</option>
    <option value="veraenderung-auf">24h % (niedrig → hoch)</option>
    <option value="veraenderung-ab">24h % (hoch → niedrig)</option>
  </select>
</div>

<div id="karten" class="karten-grid" style="display:none"></div>

<p class="chart-titel">7-Tage-Verlauf (%)</p>
<div id="chart" class="chart"></div>
<div class="chart-achsen"><span>vor 7 Tagen</span><span>heute</span></div>
<div id="chart-legende" class="legende"></div>

<script>
  // CoinGecko-IDs der 6 Coins
  const coins = [
    { id: "stellar", name: "Stellar (XLM)" },
    { id: "xdce-crowd-sale", name: "XDC Network" },
    { id: "velo", name: "VELO" },
    { id: "canton-network", name: "Canton Network (CC)" },
    { id: "zebec-network", name: "Zebec Network" },
    { id: "stronghold-token", name: "SHX Stronghold" }
  ];

  const ids = coins.map(c => c.id).join(",");
  // /coins/markets liefert Preis, 24h-Veränderung UND das Logo-Bild in einem Aufruf
  const PREIS_URL = `https://api.coingecko.com/api/v3/coins/markets?vs_currency=eur&ids=${ids}&price_change_percentage=24h`;
  const PREIS_ABSTAND_MS = 60000;      // Preise: alle 60 Sekunden
  const VERLAUF_ABSTAND_MS = 5 * 60000; // 7-Tage-Verlauf: alle 5 Minuten (schont die kostenlose API)

  let letzteDaten = null;     // letzte erfolgreich geladene Preisliste
  let letzterErfolg = null;   // Uhrzeit der letzten erfolgreichen Aktualisierung
  const verlaufsDaten = {};   // coin-id -> Array von Preisen der letzten 7 Tage
  const letztePreise = {};    // coin-id -> zuletzt angezeigter Preis (für Blitz-Animation)
  let ersterAufbau = true;    // true = Karten sollen beim nächsten Zeichnen einblenden
  let ersteChartAnzeige = true; // true = Linien im Chart sollen beim nächsten Zeichnen einblenden
  const CHART_FARBEN = ["#8c7cf0", "#4fd1c5", "#f6ad55", "#f687b3", "#68d391", "#63b3ed"];

  // --- Preise laden ---
  function kurseLaden() {
    fetch(PREIS_URL)
      .then(antwort => {
        if (!antwort.ok) {
          const grund = antwort.status === 429
            ? "zu viele Anfragen, bitte kurz warten"
            : "Serverfehler " + antwort.status;
          throw new Error(grund);
        }
        return antwort.json();
      })
      .then(liste => {
        letzteDaten = liste;
        letzterErfolg = new Date().toLocaleTimeString("de-DE");
        alleAnzeigen();

        const status = document.getElementById("status");
        status.textContent = "Stand: " + letzterErfolg + " (Auto-Refresh alle 60 Sek.)";
        status.classList.remove("fehler");
      })
      .catch(fehler => {
        const status = document.getElementById("status");
        status.classList.add("fehler");
        status.textContent = letzteDaten
          ? "⚠ Aktualisierung fehlgeschlagen (" + fehler.message + ") – zeige letzten Stand von " + letzterErfolg
          : "⚠ Fehler beim Laden der Daten: " + fehler.message;
      });
  }

  // --- 7-Tage-Verlauf laden (für die Sparkline in der Karte) ---
  // Nacheinander statt gleichzeitig, damit die kostenlose API nicht mit 6 parallelen
  // Anfragen das Rate-Limit auslöst (führt sonst zu HTTP 429 "Too Many Requests").
  function warte(ms) {
    return new Promise(resolve => setTimeout(resolve, ms));
  }

  async function verlaufLaden() {
    for (const coin of coins) {
      try {
        const antwort = await fetch(`https://api.coingecko.com/api/v3/coins/${coin.id}/market_chart?vs_currency=eur&days=7`);
        if (antwort.ok) {
          const daten = await antwort.json();
          if (daten && daten.prices) {
            verlaufsDaten[coin.id] = daten.prices.map(p => p[1]);
            alleAnzeigen();
          }
        }
      } catch (fehler) {
        // einzelner Coin ohne Verlauf ist kein Problem, die anderen laufen weiter
      }
      await warte(1500); // kleine Pause zwischen den Anfragen
    }
  }

  // Liefert die Coins in der aktuell gewählten Sortierung, jeweils mit den passenden Marktdaten
  function sortierteCoins() {
    if (!letzteDaten) return [];

    let eintraege = coins
      .map(coin => ({ coin, info: letzteDaten.find(c => c.id === coin.id) }))
      .filter(e => e.info);

    const modus = document.getElementById("sortierung").value;
    if (modus === "preis-auf") {
      eintraege.sort((a, b) => a.info.current_price - b.info.current_price);
    } else if (modus === "preis-ab") {
      eintraege.sort((a, b) => b.info.current_price - a.info.current_price);
    } else if (modus === "veraenderung-auf") {
      eintraege.sort((a, b) => a.info.price_change_percentage_24h - b.info.price_change_percentage_24h);
    } else if (modus === "veraenderung-ab") {
      eintraege.sort((a, b) => b.info.price_change_percentage_24h - a.info.price_change_percentage_24h);
    }
    // "standard" = Reihenfolge wie oben in der coins-Liste definiert, kein Sortieren nötig
    return eintraege;
  }

  // Baut ein kleines SVG-Liniendiagramm aus einer Preis-Liste
  function sparklineSvg(preise) {
    if (!preise || preise.length < 2) return "…";

    const breite = 90, hoehe = 26;
    const min = Math.min(...preise);
    const max = Math.max(...preise);
    const spanne = (max - min) || 1;

    const punkte = preise.map((preis, i) => {
      const x = (i / (preise.length - 1)) * breite;
      const y = hoehe - ((preis - min) / spanne) * hoehe;
      return x.toFixed(1) + "," + y.toFixed(1);
    }).join(" ");

    const farbe = preise[preise.length - 1] >= preise[0] ? "#4caf50" : "#f44336";

    return `<svg width="${breite}" height="${hoehe}" viewBox="0 0 ${breite} ${hoehe}">
      <polyline points="${punkte}" fill="none" stroke="${farbe}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </svg>`;
  }

  // Zeichnet sowohl Karten als auch Balkendiagramm neu (z.B. nach Sortierungswechsel)
  function alleAnzeigen() {
    const eintraege = sortierteCoins();
    if (eintraege.length === 0) return;

    kartenZeichnen(eintraege);
    linienChartZeichnen(eintraege);

    document.getElementById("karten").style.display = "grid";
  }

  function kartenZeichnen(eintraege) {
    const grid = document.getElementById("karten");
    grid.innerHTML = "";

    eintraege.forEach(({ coin, info }, index) => {
      const preis = info.current_price;
      const veraenderung = info.price_change_percentage_24h;
      const farbe = veraenderung >= 0 ? "gruen" : "rot";
      const pfeil = veraenderung >= 0 ? "▲" : "▼";
      const vorzeichen = veraenderung >= 0 ? "+" : "";

      // Preis mit vorherigem Stand vergleichen, um kurz "aufzublitzen"
      const alterPreis = letztePreise[coin.id];
      const geaendert = alterPreis !== undefined && alterPreis !== preis;
      letztePreise[coin.id] = preis;

      const karte = document.createElement("div");
      karte.className = "coin-karte";
      if (ersterAufbau) {
        karte.style.animationDelay = (index * 0.08) + "s";
      } else {
        // Einblend-Animation nur beim allerersten Aufbau, nicht bei jedem Refresh
        karte.style.animation = "none";
        karte.style.opacity = "1";
      }

      karte.innerHTML = `
        <div class="karte-kopf">
          <img class="logo" src="${info.image}" alt="${coin.name}">
          <span class="karte-name">${coin.name}</span>
        </div>
        <div class="karte-preis${geaendert ? " blitz" : ""}">${preis.toFixed(6)} €</div>
        <div class="karte-aenderung ${farbe}">${pfeil} ${vorzeichen}${veraenderung.toFixed(2)} %</div>
        <div class="karte-sparkline">${sparklineSvg(verlaufsDaten[coin.id])}</div>
      `;
      grid.appendChild(karte);
    });

    ersterAufbau = false;

    // Blitz-Markierung nach kurzer Zeit wieder entfernen
    grid.querySelectorAll(".blitz").forEach(el => {
      setTimeout(() => el.classList.remove("blitz"), 900);
    });
  }

  // Zeichnet ein gemeinsames Liniendiagramm: 7-Tage-Verlauf aller Coins, normiert in % seit Tag 1
  function linienChartZeichnen(eintraege) {
    const chart = document.getElementById("chart");
    const legende = document.getElementById("chart-legende");

    const serien = eintraege
      .map(({ coin }, index) => {
        const preise = verlaufsDaten[coin.id];
        if (!preise || preise.length < 2) return null;
        const ersterPreis = preise[0];
        const prozente = preise.map(p => ((p - ersterPreis) / ersterPreis) * 100);
        return { coin, farbe: CHART_FARBEN[index % CHART_FARBEN.length], prozente };
      })
      .filter(Boolean);

    if (serien.length === 0) {
      chart.innerHTML = '<p style="text-align:center;color:#999">Lade 7-Tage-Verlauf…</p>';
      legende.innerHTML = "";
      return;
    }

    const breite = 600, hoehe = 220, polster = 10;
    const alleWerte = serien.flatMap(s => s.prozente).concat(0); // 0 immer mit einschließen, damit die Nulllinie sichtbar bleibt
    const min = Math.min(...alleWerte);
    const max = Math.max(...alleWerte);
    const spanne = (max - min) || 1;

    function y(wert) {
      return hoehe - polster - ((wert - min) / spanne) * (hoehe - 2 * polster);
    }

    const nullY = y(0).toFixed(1);
    let svgInhalt = `<line x1="0" y1="${nullY}" x2="${breite}" y2="${nullY}" stroke="#555" stroke-width="1" stroke-dasharray="4 4" />`;

    serien.forEach((serie, index) => {
      const n = serie.prozente.length;
      const punkte = serie.prozente.map((wert, i) => {
        const x = (i / (n - 1)) * breite;
        return `${x.toFixed(1)},${y(wert).toFixed(1)}`;
      }).join(" ");

      // Beim allerersten Zeichnen blenden die Linien nacheinander ein, danach nicht mehr
      const animation = ersteChartAnzeige
        ? `style="animation-delay:${(index * 0.15).toFixed(2)}s"`
        : `style="animation:none;opacity:1"`;

      svgInhalt += `<polyline points="${punkte}" fill="none" stroke="${serie.farbe}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="linie" ${animation} />`;
    });

    chart.innerHTML = `<svg viewBox="0 0 ${breite} ${hoehe}" preserveAspectRatio="none" class="linien-chart">${svgInhalt}</svg>`;

    legende.innerHTML = serien.map(serie =>
      `<div class="legende-eintrag"><span class="legende-farbe" style="background:${serie.farbe}"></span> ${serie.coin.name}</div>`
    ).join("");

    ersteChartAnzeige = false;
  }

  document.getElementById("sortierung").addEventListener("change", alleAnzeigen);

  kurseLaden();
  verlaufLaden();
  setInterval(kurseLaden, PREIS_ABSTAND_MS);
  setInterval(verlaufLaden, VERLAUF_ABSTAND_MS);
</script>

</body>
</html>
